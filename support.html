<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique WWF - Support & Panier</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <img src="images/logo.png" alt="Logo de l'association WWF" class="logo">
        <nav>
            <a href="index.html">Accueil</a>
            <a href="categorie-1.html">Peluches</a>
            <a href="categorie-2.html">Vêtements Bio</a>
            <a href="categorie-3.html">Accessoires</a>
            <a href="categorie-4.html">Parrainages</a>
            <a href="support.html">Contact & Panier</a>
        </nav>
    </header>

    <main>
        <h2>Votre Panier & Service Support</h2>

        <!-- Formulaire de contact fonctionnel (Exigence du barème) -->
        <div class="form-container">
            <h3>Contactez le support client</h3>
            <p>Une question sur un article ou sur votre commande ? Envoyez-nous un message.</p>

            <form action="https://formspree.io/f/xgeggpkw" method="POST">
                <div class="champ">
                    <label for="nom">Nom complet :</label>
                    <input type="text" id="nom" name="nom" required placeholder="Ex: Jean Dupont">
                </div>

                <div class="champ">
                    <label for="email">Adresse e-mail :</label>
                    <input type="email" id="email" name="email" required placeholder="Ex: jean.dupont@email.com">
                </div>

                <div class="champ">
                    <label for="sujet">Objet du message :</label>
                    <select id="sujet" name="sujet">
                        <option value="panier">Question sur mon panier</option>
                        <option value="livraison">Information sur la livraison</option>
                        <option value="autre">Autre demande</option>
                    </select>
                </div>

                <div class="champ">
                    <label for="message">Message :</label>
                    <textarea id="message" name="message" rows="5" required placeholder="Écrivez votre message..."></textarea>
                </div>

                <button type="submit" class="bouton">Envoyer le message</button>
            </form>
        </div>
    </main>

    <footer>
        <p>Boutique Officielle Solidaire WWF</p>
        <p><a href="index.html">Accueil</a> | <a href="support.html">Support</a> | <a href="404.html">Mentions Légales</a></p>
    </footer>

</body>
</html>
